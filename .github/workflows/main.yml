name: Auto Upload Data

on:
  schedule:
    - cron: "0 16 * * *"   # 12h Québec (16h UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old files
        run: |
          mkdir -p public/data
          rm -f public/data/*.json || true
          rm -f public/data/*.csv || true

      - name: Download JSONs from Google Drive (public folder)
        run: |
          pip install gdown
          mkdir -p public/data
          gdown --folder "https://drive.google.com/drive/folders/1no1S6Zqea1dpRX3f78PHGvouswmM8Mf-" -O public/data --quiet

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update from Google Drive: ${{ github.run_id }}"
          branch: main



